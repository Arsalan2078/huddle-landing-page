<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>
      Frontend Mentor | Huddle landing page with single introductory section
    </title>
  </head>

  <body>
    <header class="header">
      <div class="container">
        <img src="./images/logo.svg" alt="Huddle Logo" class="logo" />
      </div>
    </header>

    <main class="main">
      <div class="container">
        <div class="hero-image">
          <img
            src="./images/illustration-mockups.svg"
            alt="Illustration Mockups"
          />
        </div>

        <div class="content">
          <div class="content__text">
            <h1>Build The Community Your Fans Will Love</h1>
            <p>
              Huddle re-imagines the way we build communities. You have a voice,
              but so does your audience. Create connections with your users as
              you engage in genuine discussion.
            </p>
          </div>

          <button class="button">Register</button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="brands">
          <a href="#" class="brand-link"><i class="fa fa-facebook"></i></a>
          <a href="#" class="brand-link"><i class="fa fa-twitter"></i></a>
          <a href="#" class="brand-link"><i class="fa fa-instagram"></i></a>
        </div>
      </div>
    </footer>
  </body>
</html>
